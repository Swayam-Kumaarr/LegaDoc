version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: legadoc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    # AOF persistence: without this, a container restart silently loses every
    # queued OCR/AI-parse/hash-write job that hadn't been picked up yet — the
    # upload already returned 202 to the user, so that job just vanishes.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: ./api
    env_file: .env
    environment:
      - OBJECT_STORAGE_BACKEND=minio
    depends_on:
      - db
      - redis
      - minio
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
      - ./api/tests:/app/tests
      - ./workers:/workers

  # ocr_worker, ai_parser_worker, and chain_worker all build from the REPO
  # ROOT (context: .), not their own directory — each one's Dockerfile
  # COPYs api/app in as a sibling package so it can reuse the API's own
  # models/database/audit code instead of duplicating the schema. See any
  # of their Dockerfiles for the exact reasoning.
  ocr_worker:
    build:
      context: .
      dockerfile: workers/ocr_worker/Dockerfile
    command: celery -A worker worker -Q ocr --concurrency=2 --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - db
      - minio
    volumes:
      - ./workers/ocr_worker/worker.py:/worker/worker.py

  ai_parser_worker:
    build:
      context: .
      dockerfile: workers/ai_parser_worker/Dockerfile
    command: celery -A worker worker -Q ai_parser --concurrency=2 --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - db
    volumes:
      - ./workers/ai_parser_worker/worker.py:/worker/worker.py

  chain_worker:
    build:
      context: .
      dockerfile: workers/chain_worker/Dockerfile
    command: celery -A worker worker -Q chain --concurrency=2 --loglevel=info
    env_file: .env
    depends_on:
      - redis
      - db
    volumes:
      - ./fabric-network:/fabric-network

  web:
    build: ./web
    ports:
      - "5174:5173"
    volumes:
      - ./web/src:/app/src
    command: npm run dev -- --host

volumes:
  db_data:
  minio_data:
  redis_data:
